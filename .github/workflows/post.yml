name: Post to Instagram

on:
  schedule:
    - cron: "0 11 * * *"
      timezone: "Pacific/Auckland"
    - cron: "0 19 * * *"
      timezone: "Pacific/Auckland"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no external API calls and no file deletion)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-autoposter
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poster
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INSTA_TOKEN: ${{ secrets.INSTA_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v21.0' }}
        run: python poster.py

      - name: Commit posted queue changes
        if: success() && env.DRY_RUN != 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: remove successfully posted images"
